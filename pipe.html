<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単管パイプ簡易物置 3Dワイヤーフレーム設計図</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; font-family: sans-serif; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            z-index: 100;
            display:block;
            color: #333;
            pointer-events: none; /* 文字の上でもマウス操作を通す */
        }
        #info h1 { margin: 5px 0; font-size: 1.2em; }
        #info p { margin: 5px 0; font-size: 0.9em; background: rgba(255,255,255,0.7); display: inline-block; padding: 5px; border-radius: 4px;}
        #container { width: 100%; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="info">
        <h1>旭川仕様：単管パイプ物置 ワイヤーフレーム</h1>
        <p>マウスドラッグで回転、スクロールでズームできます。<br>青：基本構造体 / 赤：屋根垂木（雪滑落用勾配）</p>
    </div>
    <div id="container"></div>

    <script>
        let scene, camera, renderer, controls;

        init();
        animate();

        function init() {
            // シーンの作成
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);

            // カメラの作成
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3, 2.5, 4); // 見やすい位置に配置

            // レンダラーの作成
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            // コントロール（マウス操作）の追加
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // 床面グリッドと軸の表示
            const gridHelper = new THREE.GridHelper(5, 10);
            scene.add(gridHelper);
            // const axesHelper = new THREE.AxesHelper( 2 ); // 赤:X, 緑:Y(高さ), 青:Z
            // scene.add( axesHelper );

            // --- 単管パイプ構造体の作成 ---
            // 寸法設定 (メートル単位)
            const width = 1.5;  // 間口
            const depth = 1.5;  // 奥行（柱間）
            const heightFront = 2.0; // 前柱高さ
            const heightBack = 1.5;  // 後柱高さ
            const overhangBack = 0.3; // 後ろへの屋根突き出し量

            // 座標計算用の半分の値
            const w2 = width / 2;
            const d2 = depth / 2;

            // マテリアル（線の色と種類）
            const materialStructure = new THREE.LineBasicMaterial({ color: 0x0055ff, linewidth: 2 }); // 青：構造体
            const materialRoof = new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 3 }); // 赤：屋根垂木

            // 1. 構造体（柱と梁）の定義
            const structurePoints = [];
            
            // 柱4本 (地面から立つ)
            structurePoints.push(new THREE.Vector3(-w2, 0, d2), new THREE.Vector3(-w2, heightFront, d2)); // 左前
            structurePoints.push(new THREE.Vector3(w2, 0, d2), new THREE.Vector3(w2, heightFront, d2));  // 右前
            structurePoints.push(new THREE.Vector3(-w2, 0, -d2), new THREE.Vector3(-w2, heightBack, -d2)); // 左後
            structurePoints.push(new THREE.Vector3(w2, 0, -d2), new THREE.Vector3(w2, heightBack, -d2));   // 右後

            // 下部のつなぎ (足元)
            structurePoints.push(new THREE.Vector3(-w2, 0.1, d2), new THREE.Vector3(w2, 0.1, d2)); // 前
            structurePoints.push(new THREE.Vector3(-w2, 0.1, -d2), new THREE.Vector3(w2, 0.1, -d2)); // 後
            structurePoints.push(new THREE.Vector3(-w2, 0.1, d2), new THREE.Vector3(-w2, 0.1, -d2)); // 左
            structurePoints.push(new THREE.Vector3(w2, 0.1, d2), new THREE.Vector3(w2, 0.1, -d2)); // 右

            // 上部のつなぎ (柱の頭をつなぐ)
            structurePoints.push(new THREE.Vector3(-w2, heightFront, d2), new THREE.Vector3(w2, heightFront, d2)); // 前梁
            structurePoints.push(new THREE.Vector3(-w2, heightBack, -d2), new THREE.Vector3(w2, heightBack, -d2)); // 後梁
            // 側面の斜め梁 (屋根勾配の下地)
            structurePoints.push(new THREE.Vector3(-w2, heightFront, d2), new THREE.Vector3(-w2, heightBack, -d2)); // 左側面
            structurePoints.push(new THREE.Vector3(w2, heightFront, d2), new THREE.Vector3(w2, heightBack, -d2)); // 右側面

            // 構造体の描画登録
            const structureGeometry = new THREE.BufferGeometry().setFromPoints(structurePoints);
            const structureLines = new THREE.LineSegments(structureGeometry, materialStructure);
            scene.add(structureLines);


            // 2. 屋根垂木（雪滑落用の斜めパイプ）の定義
            // 勾配計算 (後ろへ突き出す部分のY座標を計算)
            const slopeRatio = (heightFront - heightBack) / depth;
            const roofendY = heightBack - (slopeRatio * overhangBack);
            const roofendZ = -d2 - overhangBack;

            const roofPoints = [];
            // 垂木 (2mパイプを想定し、後ろへ突き出す)
            // 左垂木
            roofPoints.push(new THREE.Vector3(-w2, heightFront + 0.05, d2 + 0.1)); // 少し前と上に出す
            roofPoints.push(new THREE.Vector3(-w2, roofendY, roofendZ)); 
            // 右垂木
            roofPoints.push(new THREE.Vector3(w2, heightFront + 0.05, d2 + 0.1));
            roofPoints.push(new THREE.Vector3(w2, roofendY, roofendZ));
            // 中央垂木 (補強用に入れておく)
            roofPoints.push(new THREE.Vector3(0, heightFront + 0.05, d2 + 0.1));
            roofPoints.push(new THREE.Vector3(0, roofendY, roofendZ));

            // 屋根垂木の描画登録
            const roofGeometry = new THREE.BufferGeometry().setFromPoints(roofPoints);
            const roofLines = new THREE.LineSegments(roofGeometry, materialRoof);
            scene.add(roofLines);


            // ウィンドウリサイズ対応
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // OrbitControlsの更新
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
