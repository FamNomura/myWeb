<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫型ハンガータグ 3Dモデリング</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #2c3e50; 
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 8px;
            font-family: sans-serif;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h3 {
            margin-top: 0;
            color: #333;
        }
        p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            transition: background-color 0.2s;
            width: 100%;
        }
        button:hover { 
            background-color: #2980b9; 
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <h3>猫型ハンガータグ</h3>
        <p>マウスの左ドラッグで回転、右ドラッグで移動、<br>スクロールで拡大縮小が可能です。</p>
        <button id="export-btn">STLファイルを出力</button>
    </div>

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { STLExporter } from 'three/addons/exporters/STLExporter.js';

        // 1. シーン、カメラ、レンダラーの初期化
        const scene = new THREE.Scene();
        // 背景色を暗めに設定し、モデルを目立たせる
        scene.background = new THREE.Color(0x2c3e50);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 80);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. 照明の設定
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(50, 50, 50);
        scene.add(directionalLight);

        const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
        backLight.position.set(-50, -50, -50);
        scene.add(backLight);

        // 3. 猫のシルエット（Shape）を2Dで作成
        const catShape = new THREE.Shape();
        
        // 顎（スタート位置）
        catShape.moveTo(0, -15);
        // 右頬
        catShape.quadraticCurveTo(20, -15, 20, 0);
        // 右耳
        catShape.lineTo(15, 15);
        catShape.lineTo(5, 10);
        // 頭頂部
        catShape.quadraticCurveTo(0, 12, -5, 10);
        // 左耳
        catShape.lineTo(-15, 15);
        catShape.lineTo(-20, 0);
        // 左頬
        catShape.quadraticCurveTo(-20, -15, 0, -15);

        // ハンガー（紐やフック）を通すための穴を作成
        const holePath = new THREE.Path();
        // 中心X:0, 中心Y:-8, 半径:3 の円をくり抜く
        holePath.absarc(0, -8, 3, 0, Math.PI * 2, false); 
        catShape.holes.push(holePath);

        // 4. 2DのShapeを押し出して3Dジオメトリに変換
        const extrudeSettings = {
            depth: 3,             // 厚み（3mm）
            bevelEnabled: true,   // 面取りを有効化（プリント時の定着と手触り向上）
            bevelSegments: 3,     // 面取りの滑らかさ
            steps: 1,
            bevelSize: 0.8,       // 面取りの幅
            bevelThickness: 0.8   // 面取りの厚み
        };
        const geometry = new THREE.ExtrudeGeometry(catShape, extrudeSettings);
        
        // モデルの中心座標を原点(0,0,0)に合わせる（スライサーでの扱いやすさ向上のため）
        geometry.center();

        // プレビュー用のマテリアル設定（プリント時の色とは無関係）
        const material = new THREE.MeshStandardMaterial({ 
            color: 0xf39c12, 
            roughness: 0.4,
            metalness: 0.1
        });
        const catMesh = new THREE.Mesh(geometry, material);
        scene.add(catMesh);

        // グリッドヘルパーを追加（サイズの目安、1マス10mm想定）
        const gridHelper = new THREE.GridHelper(100, 10, 0xffffff, 0xffffff);
        gridHelper.material.opacity = 0.2;
        gridHelper.material.transparent = true;
        gridHelper.rotation.x = Math.PI / 2; // XY平面に合わせる
        scene.add(gridHelper);

        // 5. カメラ操作のコントロール
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 6. アニメーションループ処理
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 7. ウィンドウリサイズ時の自動調整
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 8. STLエクスポート処理（ボタンクリック時）
        document.getElementById('export-btn').addEventListener('click', () => {
            const exporter = new STLExporter();
            // シーン全体からモデルを解析してSTL文字列を生成
            const stlString = exporter.parse(scene);
            
            // Blob化してダウンロードトリガーを発火
            const blob = new Blob([stlString], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.style.display = 'none';
            link.href = url;
            link.download = 'cat_hanger_tag.stl';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
